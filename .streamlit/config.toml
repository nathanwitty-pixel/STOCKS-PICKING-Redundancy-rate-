# Same as the Marketing dashboard's app (its CSS paints the V5 light / dark look over this).
[theme]
base = "dark"
primaryColor = "#4f46e5"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1e2130"
textColor = "#e2e8f0"
font = "sans serif"

[server]
# Streamlit Cloud: headless (no start-up prompt) on its default port 8501. On this PC the app is started with
# --server.port 8502 --server.headless false (streamlit_app.py / Stocks Picking app.bat), next to the dashboard on 8501.
headless = true

[browser]
gatherUsageStats = false

[client]
# "auto": the Deploy button shows when the app runs on this PC; Streamlit Cloud viewers never see it
toolbarMode = "auto"
